# nginx del frontend: sirve la aplicación Angular y reenvía /api al backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # API: mismo origen que el frontend, así no hace falta CORS y la cookie de refresco es SameSite=Strict
    location /api/ {
        include /etc/nginx/cabeceras-seguridad.conf;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos con huella en el nombre: caché larga
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta carga index.html
    location / {
        include /etc/nginx/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
