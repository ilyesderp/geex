# Análisis estático de seguridad (CodeQL) del backend Java y del frontend TypeScript.
name: CodeQL

on:
  pull_request:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  analizar:
    name: CodeQL · ${{ matrix.lenguaje }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.lenguaje }}
