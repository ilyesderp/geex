# Infraestructura local de desarrollo.
# El backend y el frontend se ejecutan fuera de Docker (mvnw / ng serve).
# Los valores salen del archivo .env generado por scripts/setup.*
name: geex

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GEEX_DB_NAME:?Ejecuta scripts/setup para generar el archivo .env}
      POSTGRES_USER: ${GEEX_DB_ADMIN_USER:?Ejecuta scripts/setup para generar el archivo .env}
      POSTGRES_PASSWORD: ${GEEX_DB_ADMIN_PASSWORD:?Ejecuta scripts/setup para generar el archivo .env}
      GEEX_DB_APP_PASSWORD: ${GEEX_DB_APP_PASSWORD:?Ejecuta scripts/setup para generar el archivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Captura todos los correos que envía la aplicación: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-datos:
